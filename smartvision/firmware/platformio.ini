; SmartVision Firmware PlatformIO Configuration
; Target Microcontroller: ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
; Hardware Verification Phase 1, Sensor Integration Phase 2, & Modular Firmware Phase 3

[platformio]
default_envs = smartvision_firmware, sensor_suite, hardware_suite
src_dir = src
include_dir = include

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps = 
	links2004/WebSockets@^2.7.3
	bblanchon/ArduinoJson@^7.4.3

; ==============================================================================
; Phase 3: Modular Production Firmware Target
; ==============================================================================
[env:smartvision_firmware]
build_src_filter = 
	+<firmware_main.cpp>
	+<wifi_manager.cpp>
	+<websocket_client.cpp>
	+<protocol_handler.cpp>
	+<motion_engine.cpp>
	+<sensor_engine.cpp>

; ==============================================================================
; Unified Interactive Suites (Phases 1 & 2)
; ==============================================================================

; Phase 2: Unified Interactive Sensor Verification Suite (HC-SR04, HC-SR501, Buzzer, LED)
[env:sensor_suite]
build_src_filter = +<sensor_suite.cpp>

; Phase 1: Unified Interactive Hardware Verification Suite (PCA9685, Pan/Tilt Servos)
[env:hardware_suite]
build_src_filter = +<main.cpp>

; ==============================================================================
; Standalone Component Diagnostic Targets
; ==============================================================================

; Standalone Test 01: ESP32-S3 & PCA9685 I2C Bus Enumeration
[env:test_01_i2c_scan]
build_src_filter = +<standalone/01_i2c_scanner.cpp>

; Standalone Test 02: TowerPro MG996R Pan Servo Independent Verification (Channel 0)
[env:test_02_mg996r_pan]
build_src_filter = +<standalone/02_mg996r_pan_test.cpp>

; Standalone Test 03: TowerPro MG90S Tilt Servo Independent Verification (Channel 1)
[env:test_03_mg90s_tilt]
build_src_filter = +<standalone/03_mg90s_tilt_test.cpp>

; Standalone Test 04: Active Buzzer Driver Verification (GPIO 7 via 2N2222 NPN)
[env:test_04_buzzer]
build_src_filter = +<standalone/04_buzzer_test.cpp>

; Standalone Test 05: HC-SR04 Ultrasonic Distance Sensor Verification (GPIO 4 / GPIO 5)
[env:test_05_ultrasonic]
build_src_filter = +<standalone/05_ultrasonic_test.cpp>

; Standalone Test 06: HC-SR501 PIR Motion Sensor Verification (GPIO 6)
[env:test_06_pir]
build_src_filter = +<standalone/06_pir_test.cpp>
